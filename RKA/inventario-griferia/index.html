<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>RKA - Sistema de Gestión de Inventario</title>
  <style>
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      margin: 0;
      color: #212529;
    }
    .loader-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      text-align: center;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(13, 110, 253, 0.15);
      border-top-color: #0d6efd;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    .loader-text { font-size: 1rem; color: #495057; font-weight: 500; }
    .loader-link { color: #0d6efd; font-weight: 600; text-decoration: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body>
  <div class="loader-wrapper">
    <div class="spinner"></div>
    <p class="loader-text">Verificando sesión...</p>
    <p class="loader-text">
      Si no eres redirigido, haz clic
      <a class="loader-link" href="./auth/login.html">aquí</a>.
    </p>
  </div>

  <script type="module">
    import { AuthService } from "./assets/js/auth/auth-core.js";

    const authService = new AuthService();

    // La cookie HttpOnly es la fuente de verdad; no redirigir solo por la
    // caché local (puede quedar obsoleta después de cerrar sesión).
    const user = await authService.refreshSession();
    window.location.replace(
      user ? "./pages/dashboard.html" : "./auth/login.html"
    );
  </script>
</body>

</html>
